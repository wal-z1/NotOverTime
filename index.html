<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="description" content="NotOverTime — multi-timer app for focused daily work." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NotOverTime" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>NotOverTime</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        try {
          const pref = localStorage.getItem('timers.v1.settings');
          if (!pref) {
            const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            return;
          }
          const data = JSON.parse(pref);
          const theme = data.theme || 'system';
          if (theme === 'dark') {
            document.documentElement.dataset.theme = 'dark';
          } else if (theme === 'light') {
            document.documentElement.dataset.theme = 'light';
          } else {
            document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
        } catch (error) {
          document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
